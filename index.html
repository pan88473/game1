<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Trivia Háptica con Chat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background: #1e1e2f; color: #fff; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        button { padding: 12px 20px; font-size: 16px; margin: 5px; cursor: pointer; border-radius: 8px; border: none; font-weight: bold; }
        .btn-suave { background: #3498db; color: white; }
        .btn-media { background: #f39c12; color: white; }
        .btn-intensa { background: #e74c3c; color: white; }
        .btn-extrema { background: #8e44ad; color: white; }
        
        /* Estilos del Chat */
        #chat-container { margin-top: 20px; background: #2a2a40; border-radius: 10px; padding: 15px; max-width: 400px; margin-left: auto; margin-right: auto; text-align: left; }
        #mensajes { height: 150px; overflow-y: auto; background: #151522; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 14px; }
        .mensaje { margin-bottom: 5px; }
        #input-chat { width: 70%; padding: 10px; border-radius: 5px; border: none; }
        #btn-enviar { width: 25%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
        
        .panel { background: #2a2a40; padding: 15px; border-radius: 10px; max-width: 400px; margin: 20px auto; }
    </style>
</head>
<body>

    <h1>🎮 Trivia Háptica en Vivo</h1>
    <p id="estado">Conectando...</p>

    <!-- Panel de Selección de Rol (Si no se ha elegido) -->
    <div id="panel-roles" style="display:none;">
        <p>Elige tu rol para entrar a la partida:</p>
        <a href="?rol=1"><button style="background:#2ecc71; color:white;">Entrar como Jugador 1 (Preguntas)</button></a><br>
        <a href="?rol=2"><button style="background:#e74c3c; color:white;">Entrar como Jugador 2 (Vulnerable)</button></a>
    </div>

    <!-- Panel para la Persona 1 (Control de Castigos por Niveles) -->
    <div id="panel-jugador1" class="panel" style="display:none;">
        <h3>Panel de Castigos (Jugador 1)</h3>
        <p>Elige la intensidad si la Persona 2 falla:</p>
        <button class="btn-suave" onclick="enviarCastigo('suave')">Suave 🪶</button>
        <button class="btn-media" onclick="enviarCastigo('media')">Media ⚡</button><br>
        <button class="btn-intensa" onclick="enviarCastigo('intensa')">Intensa 🔥</button>
        <button class="btn-extrema" onclick="enviarCastigo('extrema')">Extrema 💀</button>
    </div>

    <!-- Panel para la Persona 2 (Vulnerable a Vibración) -->
    <div id="panel-jugador2" class="panel" style="display:none;">
        <h3>Zona de Peligro (Jugador 2)</h3>
        <p>Si fallas, tu celular vibrará según la gravedad elegida por el Jugador 1.</p>
        <button style="background:#555; color:white;" onclick="probarVibracionManual()">Probar vibración manual</button>
    </div>

    <!-- Apartado de Chat en Vivo con Emojis -->
    <div id="chat-container" style="display:none;">
        <h3>💬 Chat en Vivo</h3>
        <div id="mensajes"></div>
        <input type="text" id="input-chat" placeholder="Escribe un mensaje o emoji... 😎" onkeypress="verificarEnter(event)">
        <button id="btn-enviar" onclick="enviarMensaje()">Enviar</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // PEGA AQUÍ TUS DATOS DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDiv279W04EUz6dIWMW4QLoVgQSMN-KoNQ",
  authDomain: "juegovibracion.firebaseapp.com",
  databaseURL: "https://juegovibracion-default-rtdb.firebaseio.com",
  projectId: "juegovibracion",
  storageBucket: "juegovibracion.firebasestorage.app",
  messagingSenderId: "353617360599",
  appId: "1:353617360599:web:ccc74858dff1c2fa94e292"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(window.location.search);
        const rol = params.get("rol");

        if (rol === "1" || rol === "2") {
            document.getElementById("chat-container").style.display = "block";
            document.getElementById("estado").innerText = `Conectado como Jugador ${rol}`;
            
            if (rol === "1") {
                document.getElementById("panel-jugador1").style.display = "block";
            } else {
                document.getElementById("panel-jugador2").style.display = "block";

                // ESCUCHAR CASTIGOS (Solo para el Jugador 2)
                const castigoRef = ref(db, 'partida/castigo');
                onValue(castigoRef, (snapshot) => {
                    const datos = snapshot.val();
                    if (datos && datos.timestamp) {
                        ejecutarVibracionPorNivel(datos.tipo);
                    }
                });
            }

            // ESCUCHAR EL CHAT EN TIEMPO REAL (Para ambos)
            const chatRef = ref(db, 'partida/chat');
            onValue(chatRef, (snapshot) => {
                const mensajesDiv = document.getElementById("mensajes");
                mensajesDiv.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    mensajesDiv.innerHTML += `<div class="mensaje"><b>${msg.remitente}:</b> ${msg.texto}</div>`;
                });
                mensajesDiv.scrollTop = mensajesDiv.scrollHeight; // Auto-scroll al último mensaje
            });

        } else {
            document.getElementById("panel-roles").style.display = "block";
            document.getElementById("estado").innerText = "Selecciona tu rol para comenzar";
        }

        // --- SISTEMA DE VIBRACIÓN POR NIVELES ---
        window.enviarCastigo = function(tipo) {
            const castigoRef = ref(db, 'partida/castigo');
            set(castigoRef, {
                tipo: tipo,
                timestamp: Date.now() // Usamos timestamp para que el evento se dispare siempre aunque sea el mismo tipo repetido
            });
        };

        window.ejecutarVibracionPorNivel = function(tipo) {
            if (!("vibrate" in navigator)) {
                alert("Tu dispositivo o navegador no soporta vibración.");
                return;
            }

            switch(tipo) {
                case 'suave':
                    navigator.vibrate(150); // Un toque cortito y ligero
                    break;
                case 'media':
                    navigator.vibrate([300, 100, 300]); // Dos toques moderados
                    break;
                case 'intensa':
                    navigator.vibrate([500, 150, 500, 150, 500]); // Patrón fuerte y constante
                    break;
                case 'extrema':
                    navigator.vibrate([1000, 200, 1000, 200, 1500]); // Largo y doloroso jajaja
                    break;
            }
        };

        window.probarVibracionManual = function() {
            ejecutarVibracionPorNivel('media');
        };

        // --- SISTEMA DE CHAT EN VIVO ---
        window.enviarMensaje = function() {
            const input = document.getElementById("input-chat");
            const texto = input.value.trim();
            if (texto === "") return;

            const chatRef = ref(db, 'partida/chat');
            push(chatRef, {
                remitente: `Jugador ${rol}`,
                texto: texto
            });

            input.value = ""; // Limpiar caja
        };

        window.verificarEnter = function(e) {
            if (e.key === "Enter") {
                enviarMensaje();
            }
        };
    </script>
</body>
</html>
